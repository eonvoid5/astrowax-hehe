services:
  mc-dev-ai:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MC_DEV_AI_URL: http://ai:8000
    depends_on:
      - ai

  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./ai/checkpoints:/ai/ai/checkpoints
